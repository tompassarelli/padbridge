[package]
name = "wc3-controller"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.1"
publish = false
license = "MIT"

[features]
# Builds the stand-in game window and the Windows/macOS end-to-end test.
e2e = []

[dependencies]
sdl3 = { version = "=0.20.0", features = ["build-from-source-static", "build-from-source-unix-console"] }
enigo = { git = "https://github.com/tompassarelli/enigo", rev = "0b7bae348b0ba7108b81bc4c7267e5bb2d6a509b" }
ctrlc = "3.5"

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "=0.13.2"
libc = "0.2"
x11rb = { version = "0.14", features = ["res"] }
serde_json = "1.0"
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "NSRunningApplication", "NSWorkspace"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFDate", "CFRunLoop"] }

# The end-to-end test reads OS key state.
[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.61", features = ["Win32_UI_Input_KeyboardAndMouse"] }
# Drives a ViGEmBus virtual DualShock 4 in the end-to-end test.
vigem-client = { version = "=0.1.4", features = ["unstable_ds4"] }

[[bin]]
name = "wc3-journal"
path = "src/bin/journal.rs"

[[bin]]
name = "wc3-standin"
path = "src/bin/standin.rs"
required-features = ["e2e"]
