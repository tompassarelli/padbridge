name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - os: ubuntu-latest
            asset: wc3-controller-linux-x86_64
            exe: wc3-controller
          - os: windows-latest
            asset: wc3-controller-windows-x86_64
            exe: wc3-controller.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: Linux build libraries and virtual pads
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q libudev-dev libxkbcommon-dev
          # tests/layout.rs drives the service with a virtual pad.
          sudo modprobe uinput && sudo chmod 0666 /dev/uinput
          echo 'SUBSYSTEM=="input", KERNEL=="event*", MODE="0666"' | sudo tee /etc/udev/rules.d/99-ci-pads.rules
          sudo udevadm control --reload-rules
      - name: Pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Tests
        if: runner.os == 'Linux'
        run: cargo test --locked --workspace
      # A ViGEmBus virtual DualShock 4 drives the real helper, which must type
      # every fighter-layout action, in order and nothing else, into a focused
      # stand-in "Warcraft III" window and nothing into a second window.
      - name: Install ViGEmBus virtual pad driver
        if: runner.os == 'Windows'
        run: |
          choco install vigembus --version 1.22.0 -y --no-progress
          sc.exe query ViGEmBus
      - name: Tests and end-to-end helper test
        if: runner.os == 'Windows'
        run: |
          cargo test --locked --workspace
          cargo test --locked --features e2e --test e2e -- --nocapture
      - name: Release build
        run: cargo build --locked --release --bin wc3-controller
      - name: Package
        run: |
          mkdir -p dist/${{ matrix.asset }}
          cp target/release/${{ matrix.exe }} LICENSE README.md dist/${{ matrix.asset }}/
          cp -r examples dist/${{ matrix.asset }}/
          cd dist && if [ "$RUNNER_OS" = Windows ]; then 7z a -bd ${{ matrix.asset }}.zip ${{ matrix.asset }}; else tar czf ${{ matrix.asset }}.tar.gz ${{ matrix.asset }}; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}.*
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "Linux and Windows builds of $GITHUB_REF_NAME." || true
          gh release upload "$GITHUB_REF_NAME" dist/${{ matrix.asset }}.* --clobber
