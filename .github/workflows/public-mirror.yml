name: Public mirror

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-mirror
  cancel-in-progress: true

jobs:
  mirror:
    if: github.repository == 'tompassarelli/padbridge-dev'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - env:
          TOKEN: ${{ github.token }}
          KEY: ${{ secrets.PUBLIC_MIRROR_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/mirror
          chmod 600 ~/.ssh/mirror
          git init -q --bare mirror.git
          cd mirror.git
          git fetch -q "https://x-access-token:$TOKEN@github.com/$GITHUB_REPOSITORY.git" '+refs/heads/main:refs/heads/main' '+refs/tags/v*:refs/tags/v*'
          GIT_SSH_COMMAND='ssh -i ~/.ssh/mirror -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new' \
            git push git@github.com:tompassarelli/padbridge.git refs/heads/main:refs/heads/main 'refs/tags/v*:refs/tags/v*'
